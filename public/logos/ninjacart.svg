<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Ninjacart official logo: circular with split colors -->
  <!-- Left half - pink/magenta -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#E91E63" stroke-width="3"/>
  <!-- Right half - blue -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#2196F3" stroke-width="3" stroke-dasharray="150 300"/>
  <!-- Stylized N in center -->
  <path d="M 35 35 L 35 65 L 65 35 L 65 65" fill="none" stroke="#444444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
