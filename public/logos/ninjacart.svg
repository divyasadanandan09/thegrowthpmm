<svg viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nj-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E5BFF;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#FF00B4;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#FF9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D084;stop-opacity:1" />
    </linearGradient>
    <style>
      .ninjacart-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333333; }
    </style>
  </defs>

  <!-- Circular logo with gradient -->
  <circle cx="12" cy="20" r="9" fill="none" stroke="url(#nj-grad)" stroke-width="1.5"/>

  <!-- Stylized N inside circle -->
  <path d="M 7 13 L 7 27 M 7 13 L 17 27 M 17 27 L 17 13" fill="none" stroke="#333" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small leaf accent -->
  <path d="M 16 11 Q 17 9 18 11" fill="#333" stroke="#333" stroke-width="0.4"/>

  <!-- ninjacart wordmark text -->
  <text x="30" y="24" class="ninjacart-text">ninjacart</text>
</svg>
