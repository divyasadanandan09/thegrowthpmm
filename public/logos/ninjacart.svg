<svg viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nj-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E5BFF;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#FF00B4;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#FF9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D084;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circular logo on left -->
  <circle cx="12" cy="25" r="10" fill="none" stroke="url(#nj-gradient)" stroke-width="1.5"/>
  <!-- Stylized N inside circle -->
  <path d="M 7 18 L 7 32 M 7 18 L 17 32 M 17 32 L 17 18" fill="none" stroke="#333" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small leaf -->
  <path d="M 16 14 Q 17 12 18 14" fill="#333" stroke="#333" stroke-width="0.5"/>
  <!-- ninjacart text on right -->
  <text x="28" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333333">ninjacart</text>
</svg>
